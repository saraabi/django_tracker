{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <!-- Basic SEO -->
    <meta name="description" content="Report incidents of anti-Palestinian racism, discrimination, hate, and censorship in schools, workplaces, and communities across the United States. Help document injustice and connect with support.">

    <meta name="author" content="AROC Action and the Institute for Understanding Anti-Palestinian Racism">

    <meta name="robots" content="index, follow">

    <!-- Canonical URL: replace with the actual page URL -->
    <link rel="canonical" href="https://tracker.arocaction.org/">

    <!-- Open Graph: Facebook, LinkedIn, messaging apps -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Discrimination &amp; Censorship Tracker">
    <meta property="og:title" content="Discrimination &amp; Censorship Tracker | Report Anti-Palestinian Racism">
    <meta property="og:description" content="Have you experienced or witnessed anti-Palestinian racism, discrimination, or censorship? Share your experience through our national incident tracker to help document and challenge injustice.">
    <meta property="og:url" content="https://tracker.arocaction.org/">
    <meta property="og:image" content="https://arocaction.s3.amazonaws.com/media/public/img/tracker-social.jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Discrimination &amp; Censorship Tracker — Document racism, challenge censorship, and defend our communities.">
    <meta property="og:locale" content="en_US">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Discrimination &amp; Censorship Tracker">
    <meta name="twitter:description" content="Report anti-Palestinian racism, hate, discrimination, and censorship. Help us document injustice and protect our communities.">
    <meta name="twitter:image" content="https://arocaction.s3.amazonaws.com/media/public/img/tracker-social.jpeg">

    <!-- Browser theme -->
    <meta name="theme-color" content="#7d1f2e">


    <title>
        {% block title %}
            Discrimination & Censorship Tracker
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f8f9fa;
        }

        .tracker-container {
            max-width: 950px;
        }

        .form-section {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.75rem;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .form-section h2 {
            font-size: 1.4rem;
            margin-bottom: 1.25rem;
            color: #7d1f2e;
            border-bottom: 2px solid #e9d4d8;
            padding-bottom: 0.5rem;
        }

        .form-section h3 {
            font-size: 1.1rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        .conditional-section {
            display: none;
        }

        .required-note {
            font-size: .9rem;
            color: #6c757d;
        }

        .form-check {
            margin-bottom: .5rem;
        }

        .helptext {
            display: block;
            margin-top: .25rem;
            color: #6c757d;
            font-size: .875rem;
        }

        .errorlist {
            color: #dc3545;
            list-style: none;
            padding-left: 0;
            margin-top: .25rem;
        }

        .privacy-box {
            background: #f1f3f5;
            border-left: 4px solid #343a40;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <main class="container tracker-container py-5">
        {% block content %}{% endblock %}
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block extra_js %}{% endblock %}

</body>
</html>

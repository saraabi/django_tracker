{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            AROC Education Discrimination & Censorship Tracker
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f8f9fa;
        }

        .tracker-container {
            max-width: 950px;
        }

        .form-section {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.75rem;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .form-section h2 {
            font-size: 1.4rem;
            margin-bottom: 1.25rem;
        }

        .form-section h3 {
            font-size: 1.1rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        .conditional-section {
            display: none;
        }

        .required-note {
            font-size: .9rem;
            color: #6c757d;
        }

        .form-check {
            margin-bottom: .5rem;
        }

        .helptext {
            display: block;
            margin-top: .25rem;
            color: #6c757d;
            font-size: .875rem;
        }

        .errorlist {
            color: #dc3545;
            list-style: none;
            padding-left: 0;
            margin-top: .25rem;
        }

        .privacy-box {
            background: #f1f3f5;
            border-left: 4px solid #343a40;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <main class="container tracker-container py-5">
        {% block content %}{% endblock %}
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
